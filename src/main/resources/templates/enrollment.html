<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Enroll in Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Poppins', sans-serif;
            padding: 40px 0;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            background: #fff;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .card-body {
            padding: 25px;
        }

        .card-title {
            color: #1e3d59;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-text {
            color: #555;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #ff6b6b;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #ff4757;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border-radius: 30px;
            background-color: #1e90ff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: #3742fa;
            transform: translateY(-2px);
        }

        .alert {
            border-radius: 12px;
        }

        hr {
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enroll in Courses</h1>
        
        <!-- For Students -->
        <div sec:authorize="hasRole('STUDENT')">
            <div th:if="${courses.isEmpty()}">
                <p class="alert alert-info text-center">No courses available for enrollment right now.</p>
            </div>
            
            <div th:if="${not #lists.isEmpty(courses)}">
                <div class="row">
                    <div th:each="course : ${courses}" class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${course.title}">Course Title</h5>
                                <p class="card-text" th:text="${course.description}">Course Description</p>
                                <p><strong>Duration:</strong> <span th:text="${course.duration}">Duration</span></p>
                                
                                <form th:action="@{/enrollments/enroll}" method="post" class="mt-3">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="courseId" th:value="${course.id}" />
                                    <button type="submit" class="btn btn-primary w-100">Enroll in this Course</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- For Teachers -->
        <div sec:authorize="hasRole('TEACHER')" class="text-center">
            <p class="alert alert-warning">
                Teachers cannot enroll in courses. 
                <a th:href="@{/teacher-dashboard}" class="alert-link">Go to your dashboard</a>.
            </p>
        </div>
        
        <hr>

        <!-- Navigation Buttons -->
        <div class="text-center">
            <a th:href="@{/student-dashboard}" sec:authorize="hasRole('STUDENT')" class="btn btn-secondary me-2">Back to Student Dashboard</a>
            <a th:href="@{/home}" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
