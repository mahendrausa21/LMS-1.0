<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Forum | LMS Portal</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <style>
        .forum-header {
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 1rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
            animation: slideInUp 0.5s ease-out;
        }

        .forum-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .forum-header p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1rem;
        }

        .post-form-card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            animation: slideInUp 0.4s ease-out;
        }

        .post-form-card:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .post-form-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            display: block;
            font-size: 0.95rem;
        }

        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 0.95rem;
            min-height: 120px;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: #f9fafb;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .forum-post {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            border-left: 5px solid var(--primary);
            transition: all 0.3s ease;
            animation: slideInUp 0.4s ease-out;
        }

        .forum-post:hover {
            box-shadow: var(--shadow-lg);
            transform: translateX(4px);
        }

        .forum-post.reply {
            margin-left: 2rem;
            border-left-color: #8b5cf6;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.02) 0%, rgba(139, 92, 246, 0.01) 100%);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .post-author {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .post-timestamp {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .post-content {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .post-actions {
            display: flex;
            gap: 0.75rem;
            padding-top: 1rem;
        }

        .post-actions .btn {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border-radius: 1rem;
            animation: slideInUp 0.5s ease-out;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .empty-state-text {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .empty-state .btn {
            display: inline-block;
        }

        @media (max-width: 768px) {
            .forum-header h1 {
                font-size: 1.5rem;
            }

            .forum-post.reply {
                margin-left: 1rem;
            }

            .post-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .post-timestamp {
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{layout/main :: layout(title='Forum', content=~{::#content})}">
        <div id="content">
            <!-- Header -->
            <div class="forum-header">
                <h1>💬 Course Forum</h1>
                <p>Discuss, collaborate, and learn together with your classmates and instructors</p>
            </div>

            <!-- New Post Form -->
            <div sec:authorize="isAuthenticated()">
                <div class="post-form-card">
                    <div class="post-form-title">
                        <span>✍️</span>
                        <span>Start a New Discussion</span>
                    </div>

                    <form th:action="@{/forum/post}" method="post">
                        <input type="hidden" name="courseId" th:value="${courseId}" />
                        
                        <div class="form-group">
                            <label for="content">Your Message</label>
                            <textarea id="content" name="content" placeholder="Share your thoughts, ask questions, or help your classmates..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">📤 Post Discussion</button>
                    </form>
                </div>
            </div>

            <!-- Posts List -->
            <div class="posts-container">
                <div th:if="${posts != null and !posts.isEmpty()}">
                    <div th:each="post : ${posts}" class="forum-post" th:classappend="${post.parentPost != null} ? 'reply' : ''">
                        <div class="post-header">
                            <div>
                                <div class="post-author" th:text="${post.user?.name}">User Name</div>
                                <div class="post-timestamp" th:text="${#dates.format(post.timestamp, 'MMM dd, yyyy HH:mm')}">Posted on...</div>
                            </div>
                        </div>

                        <div class="post-content" th:text="${post.content}">Post Content</div>

                        <div class="post-actions">
                            <a th:href="@{/forum/post?parentId={id}(id=${post.id})}" class="btn btn-outline">↩️ Reply</a>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div th:if="${posts == null or posts.isEmpty()}" class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <h2 class="empty-state-title">No Discussions Yet</h2>
                    <div class="empty-state-text">Be the first to start a discussion! Share your thoughts and ideas with the class.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
