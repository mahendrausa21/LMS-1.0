<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | LMS Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <style>
        body { 
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 1rem; 
            font-family: 'Inter', sans-serif;
        }
        .error-container { 
            text-align: center; 
            color: white; 
            animation: slideInUp 0.6s ease;
            max-width: 500px;
        }
        .error-code { 
            font-size: 140px; 
            font-weight: 700; 
            line-height: 1; 
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .error-title { 
            font-size: 32px; 
            font-weight: 700; 
            margin-bottom: 1rem;
        }
        .error-message { 
            font-size: 16px; 
            opacity: 0.95; 
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 1rem;
        }
        .error-btn { 
            display: inline-block; 
            margin: 0 0.5rem;
        }
        .btn-error {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
        }
        .btn-error:hover {
            background: white;
            color: #DC2626;
            transform: translateY(-2px);
        }
        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔒</div>
        <div class="error-code">403</div>
        <div class="error-title">Access Denied</div>
        <div class="error-message">You don't have permission to access this resource. Contact your administrator if you believe this is an error.</div>
        <div>
            <a href="javascript:history.back()" class="btn-error error-btn">← Go Back</a>
            <a th:href="@{/student-dashboard}" class="btn-error error-btn">📊 Dashboard</a>
        </div>
    </div>
</body>
</html>
