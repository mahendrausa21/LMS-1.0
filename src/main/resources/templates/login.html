<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LMS Portal</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/modern.css}">
    
    <style>
        body {
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }
        
        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border-radius: var(--radius-2xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: slideInUp 0.6s ease-out;
            min-height: 550px;
            max-width: 1000px;
            width: 100%;
        }
        
        .login-brand {
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-brand::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }
        
        .login-brand-content {
            position: relative;
            z-index: 1;
        }
        
        .login-brand-icon {
            font-size: 56px;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        
        .login-brand h2 {
            font-size: 32px;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: white;
        }
        
        .login-brand p {
            font-size: 15px;
            opacity: 0.95;
            margin-bottom: 2rem;
            font-weight: 500;
        }
        
        .login-brand-features {
            text-align: left;
            font-size: 14px;
            opacity: 0.9;
            line-height: 2;
            list-style: none;
            padding: 0;
        }
        
        .login-brand-features li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        
        .login-brand-features i {
            color: #10b981;
            font-size: 1.2rem;
        }
        
        .login-form-container {
            background: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-form-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .login-form-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .form-control {
            padding: 0.85rem;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            font-size: 15px;
            font-weight: 600;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .login-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        .alert {
            margin-bottom: 1rem;
            animation: slideInDown 0.3s ease-out;
        }
        
        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            
            .login-brand {
                padding: 2.5rem 2rem;
                min-height: 250px;
            }
            
            .login-form-container {
                padding: 2rem;
            }
            
            .login-brand h2 {
                font-size: 24px;
            }
            
            .login-form-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Brand Panel -->
        <div class="login-brand">
            <div class="login-brand-content">
                <div class="login-brand-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h2>LMS Portal</h2>
                <p>Learn Without Limits</p>
                <ul class="login-brand-features">
                    <li><i class="fas fa-check-circle"></i> Access all courses anytime</li>
                    <li><i class="fas fa-check-circle"></i> Track your progress</li>
                    <li><i class="fas fa-check-circle"></i> Submit assignments easily</li>
                    <li><i class="fas fa-check-circle"></i> Collaborate with peers</li>
                </ul>
            </div>
        </div>
        
        <!-- Form Panel -->
        <div class="login-form-container">
            <div class="login-form-title">Welcome Back</div>
            <div class="login-form-subtitle">Sign in to your account to continue learning</div>
            
            <!-- Error Message -->
            <div th:if="${param.error}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <div>Invalid email or password. Please try again.</div>
            </div>
            
            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <div th:text="${successMessage}"></div>
            </div>
            
            <form th:action="@{/login}" method="post" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
            
            <div class="login-footer">
                Don't have an account? <a th:href="@{/register}"><i class="fas fa-user-plus"></i> Create one here</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script th:src="@{/js/modern.js}"></script>
</body>
</html>
