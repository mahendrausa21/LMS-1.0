# Application Name
spring.application.name=lms

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lms_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:m@hendr@}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Configuration (for development)
spring.thymeleaf.cache=false  
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# File Upload Configuration (for assignments and materials)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB  
spring.servlet.multipart.max-request-size=10MB

# JPA Optimization
spring.jpa.open-in-view=false

# Server Error Handling
server.error.include-stacktrace=never
server.error.include-message=always
